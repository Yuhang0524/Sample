name: Test Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      test_message:
        description: "Custom message to print"
        required: false
        default: "Manual test triggered successfully!"
        type: string

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Basic echo test
        run: |
          echo "GitHub Actions is working!"
          echo "Runner OS: ${{ runner.os }}"
          echo "Actor: ${{ github.actor }}"
          echo "Branch/Ref: ${{ github.ref }}"

      - name: Check pre-installed tools
        run: |
          git --version
          curl --version | head -n 1
          python3 --version
          node --version

      - name: Display custom dispatch input
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Input message: ${{ inputs.test_message }}"

      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Run Prisma Cloud
        id: Prisma-Cloud
        uses: bridgecrewio/checkov-action@master
        env:
          PRISMA_API_URL: https://api.anz.prismacloud.io
        with:
          api-key: ${{ secrets.BC_API_KEY }}
          use_enforcement_rules: true
